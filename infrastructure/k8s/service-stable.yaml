apiVersion: v1
kind: Service
metadata:
  name: veltrix-stable-service
  namespace: default
  labels:
    app: veltrix
    routing: blue-green-stable
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 5000
    nodePort: 30080
    protocol: TCP
  selector:
    app: veltrix
    env: green
