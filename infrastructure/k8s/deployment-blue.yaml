apiVersion: apps/v1
kind: Deployment
metadata:
  name: veltrix-backend
  namespace: blue
  labels:
    app: veltrix
    component: backend
    env: blue
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: veltrix
      component: backend
      env: blue
  template:
    metadata:
      labels:
        app: veltrix
        component: backend
        env: blue
    spec:
      serviceAccountName: veltrix-backend
      containers:
      - name: backend
        image: 864046983878.dkr.ecr.us-east-1.amazonaws.com/veltrix-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: veltrix-secrets
              key: mongodb-uri
        - name: AWS_REGION
          value: "us-east-1"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
