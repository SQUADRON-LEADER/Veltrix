# Veltrix Fleet Inventory
[jenkins]
jenkins-node ansible_host=10.0.1.10 ansible_user=ubuntu

[k8s_master]
k8s-master-node ansible_host=10.0.1.20 ansible_user=ubuntu

[k8s_workers]
k8s-worker-1 ansible_host=10.0.1.21 ansible_user=ubuntu
k8s-worker-2 ansible_host=10.0.1.22 ansible_user=ubuntu

[k8s_cluster:children]
k8s_master
k8s_workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
