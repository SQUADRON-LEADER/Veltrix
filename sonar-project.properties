# =============================================================================
# Veltrix — SonarQube Project Configuration
# Author: Aayush | Module 3: SonarQube Code Quality & Security Scanning
# =============================================================================

# Unique project key in SonarQube
sonar.projectKey=veltrix-app
sonar.projectName=Veltrix Enterprise DevOps Platform
sonar.projectVersion=1.0.0

# Source directories for analysis
sonar.sources=backend,frontend/vite-project/src

# Exclude dependencies, build artifacts, and vendor files from scan
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.js,**/*.test.js

# Language settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# Test report integration (Jest)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Quality Gate Threshold Expectations:
# - Blocker Issues: 0
# - Critical Vulnerabilities: 0
# - Code Coverage: >= 70%
# - Security Hotspots Reviewed: 100%
